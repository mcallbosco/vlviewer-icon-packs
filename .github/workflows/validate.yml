name: Validate packs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packs/**'
      - 'schemas/**'
      - 'tools/validate.mjs'
      - 'package.json'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'packs/**'
      - 'schemas/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

concurrency:
  group: validate-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Validate pack metadata
        run: node tools/validate.mjs

  trigger-vlviewer:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      VLVIEWER_PAGES_DEPLOY_HOOK: ${{ secrets.VLVIEWER_PAGES_DEPLOY_HOOK }}
    steps:
      - name: Trigger the VLViewer Cloudflare Pages build
        if: env.VLVIEWER_PAGES_DEPLOY_HOOK != ''
        run: >-
          curl --fail-with-body --retry 3 --retry-all-errors
          --request POST "$VLVIEWER_PAGES_DEPLOY_HOOK"

      - name: Report an unconfigured deploy hook
        if: env.VLVIEWER_PAGES_DEPLOY_HOOK == ''
        run: >-
          echo "::warning::VLVIEWER_PAGES_DEPLOY_HOOK is not configured;
          validation passed, but no Cloudflare Pages build was triggered."
